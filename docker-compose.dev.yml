services:
  frontend:
    image: node:20-slim
    working_dir: /app
    command: sh -c "NODE_OPTIONS='--max-old-space-size=256' node .next/standalone/server.js"
    cpus: "1.5"
    mem_limit: 384m
    mem_reservation: 128m
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - NEXT_PUBLIC_API_URL=
      - NEXT_PUBLIC_WS_URL=
      - HOST_METRICS_URL=http://host.docker.internal:8766/metrics
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.fix-xfh.headers.customrequestheaders.X-Forwarded-Host=47.96.252.144"
      - "traefik.http.routers.frontend.middlewares=fix-xfh@docker"
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 223.5.5.5
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles: []

  ai-service:
    image: traceos-lab-ai-service:final3
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./services/ai-service:/app
    environment:
      - SERVICE_NAME=ai-service
      - PORT=8000
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=${PG_USER:-traceos}
      - PG_PASSWORD=${PG_PASSWORD:-traceos_dev}
      - PG_DATABASE=${PG_DATABASE:-traceos}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NATS_URL=nats://nats:4222
      - CORE_SERVICE_URL=http://core-service:8080
      - JWT_SECRET=${JWT_SECRET:-change-me}
      - LLM_PROVIDER=${LLM_PROVIDER:-deepseek-v4}
      - LLM_API_KEY=${LLM_API_KEY:-sk-92d1a8618828499f824a2bacc39f6733}
      - HF_ENDPOINT=https://hf-mirror.com
    mem_limit: 1024m
    mem_reservation: 256m
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ai.rule=PathPrefix(`/api/ai/`)"
      - "traefik.http.routers.ai.entrypoints=web"
      - "traefik.http.services.ai.loadbalancer.server.port=8000"
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 223.5.5.5
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles: []

  core-service:
    image: golang:1.22-alpine
    working_dir: /app
    command: /scripts/dev-hotreload.sh ./cmd/server
    volumes:
      - ./services/core-service:/app
      - ./ebpf/scripts:/ebpf:ro
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - ./deploy/dev-go-hotreload.sh:/scripts/dev-hotreload.sh:ro
    privileged: true
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
      - BPF
      - PERFMON
    ulimits:
      memlock:
        soft: -1
        hard: -1
    environment:
      - SERVICE_NAME=core-service
      - EBPF_SCRIPTS_DIR=/ebpf
      - PORT=8080
      - GRPC_PORT=9090
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=${PG_USER:-traceos}
      - PG_PASSWORD=${PG_PASSWORD:-traceos_dev}
      - PG_DATABASE=${PG_DATABASE:-traceos}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NATS_URL=nats://nats:4222
      - AI_SERVICE_URL=http://ai-service:8000
      - SANDBOX_MODE=local
      - SANDBOX_BACKEND=local
      - GOPROXY=https://goproxy.cn,direct
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.core.rule=PathPrefix(`/api/v1/`)"
      - "traefik.http.routers.core.service=core"
      - "traefik.http.routers.core.entrypoints=web"
      - "traefik.http.services.core.loadbalancer.server.port=8080"
      - "traefik.http.routers.core-ws.rule=PathPrefix(`/ws/`)"
      - "traefik.http.routers.core-ws.service=core-ws"
      - "traefik.http.routers.core-ws.entrypoints=web"
      - "traefik.http.routers.core-ws.priority=50"
      - "traefik.http.services.core-ws.loadbalancer.server.port=8080"
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 223.5.5.5
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles: []

  observability:
    image: golang:1.22-alpine
    working_dir: /app
    command: /scripts/dev-hotreload.sh ./cmd/server
    volumes:
      - ./services/observability:/app
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /tmp/traceos-sandbox:/tmp/traceos-sandbox
      - ./deploy/dev-go-hotreload.sh:/scripts/dev-hotreload.sh:ro
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
      - BPF
      - PERFMON
      - NET_ADMIN
      - DAC_READ_SEARCH
    ulimits:
      memlock:
        soft: -1
        hard: -1
    environment:
      - SERVICE_NAME=observability
      - PORT=9091
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=${PG_USER:-traceos}
      - PG_PASSWORD=${PG_PASSWORD:-traceos_dev}
      - PG_DATABASE=${PG_DATABASE:-traceos}
      - NATS_URL=nats://nats:4222
      - GOPROXY=https://goproxy.cn,direct
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.obs.rule=PathPrefix(`/api/obs/`)"
      - "traefik.http.routers.obs.entrypoints=web"
      - "traefik.http.routers.obs.priority=200"
      - "traefik.http.services.obs.loadbalancer.server.port=9091"
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 223.5.5.5
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles: []
