# =============================================================================
# TraceOS Lab - 统一 Docker Compose 配置
# =============================================================================
#
# 使用 profiles 控制服务启停：
#
#   默认 (无 profile)  → 基础设施：PostgreSQL, Redis, MinIO, NATS, Traefik
#   app                → 应用服务：Core, AI, Observability, Frontend
#   monitoring         → 监控栈：Prometheus, Grafana, Loki, Jaeger
#
# 快速开始：
#   docker compose up -d                       # 仅基础设施
#   docker compose --profile app up -d         # 基础设施 + 应用
#   docker compose --profile monitoring up -d  # 基础设施 + 监控
#   docker compose --profile app --profile monitoring up -d  # 全部启动
#
# =============================================================================

services:

  # ===========================================================================
  # 基础设施 (默认启动)
  # ===========================================================================

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: traceos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DATABASE:-traceos}
      POSTGRES_USER: ${PG_USER:-traceos}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-traceos_dev}
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-traceos} -d ${PG_DATABASE:-traceos}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: traceos-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes --save 60 1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: traceos-minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-traceos}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-traceos_dev}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2-alpine
    container_name: traceos-nats
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NATS_PORT:-4222}:4222"
      - "127.0.0.1:${NATS_MONITOR_PORT:-8222}:8222"
    command: >
      --jetstream
      --store_dir /data
      --http_port 8222
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  traefik:
    image: traefik:latest
    container_name: traceos-traefik
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "127.0.0.1:${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--log.level=INFO"
      - "--accesslog=false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/overview || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ===========================================================================
  # 监控栈 (--profile monitoring)
  # ===========================================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: traceos-prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    container_name: traceos-grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  loki:
    image: grafana/loki:latest
    container_name: traceos-loki
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./deploy/monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: traceos-jaeger
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  # ===========================================================================
  # 应用服务 (--profile app)
  # ===========================================================================

  core-service:
    image: traceos-lab-core-service:latest
    container_name: traceos-core
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./ebpf/scripts:/ebpf:ro
      - /sys/kernel/debug:/sys/kernel/debug:ro
    privileged: true
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
      - BPF
      - PERFMON
    ulimits:
      memlock:
        soft: -1
        hard: -1
    environment:
      - SERVICE_NAME=core-service
      - EBPF_SCRIPTS_DIR=/ebpf
      - PORT=8080
      - GRPC_PORT=9090
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=${PG_USER:-traceos}
      - PG_PASSWORD=${PG_PASSWORD:-traceos_dev}
      - PG_DATABASE=${PG_DATABASE:-traceos}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NATS_URL=nats://nats:4222
      - AI_SERVICE_URL=http://ai-service:8000
      - SANDBOX_MODE=${SANDBOX_MODE:-nsjail}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.core.rule=PathPrefix(`/api/v1/`)"
      - "traefik.http.routers.core.service=core"
      - "traefik.http.routers.core.entrypoints=web"
      - "traefik.http.services.core.loadbalancer.server.port=8080"
      - "traefik.http.routers.core-ws.rule=PathPrefix(`/ws/`)"
      - "traefik.http.routers.core-ws.service=core-ws"
      - "traefik.http.routers.core-ws.entrypoints=web"
      - "traefik.http.routers.core-ws.priority=50"
      - "traefik.http.services.core-ws.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ai-service:
    image: traceos-lab-ai-service:final3
    container_name: traceos-ai
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    volumes:
      # 🧠 宿主机 HF 模型缓存（避免重复下载 2.5GB，节省磁盘）
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      # 源码热更新挂载（dev 模式，改代码自动生效）
      - ./services/ai-service:/app
      - ./services/ai-service/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file:
      - .env
    environment:
      - SERVICE_NAME=ai-service
      - PORT=8000
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=${PG_USER:-traceos}
      - PG_PASSWORD=${PG_PASSWORD:-traceos_dev}
      - PG_DATABASE=${PG_DATABASE:-traceos}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NATS_URL=nats://nats:4222
      - CORE_SERVICE_URL=http://core-service:8080
      - LLM_PROVIDER=${LLM_PROVIDER:-deepseek-v4}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_API_BASE_URL=${LLM_API_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-300}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-3}
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ai.rule=PathPrefix(`/api/ai/`)"
      - "traefik.http.routers.ai-courses.rule=PathRegexp(`^/api/v1/courses/[^/]+/(rag|knowledge|chat|ask)(/.*)?$`)"
      - "traefik.http.routers.ai-courses.entrypoints=web"
      - "traefik.http.routers.ai-courses.priority=200"
      - "traefik.http.routers.ai-courses.service=ai"
      - "traefik.http.routers.ai.entrypoints=web"
      - "traefik.http.routers.ai.service=ai"
      - "traefik.http.services.ai.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  observability:
    image: traceos-lab-observability:latest
    container_name: traceos-observability
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
      - BPF
      - PERFMON
      - NET_ADMIN
      - DAC_READ_SEARCH
    ulimits:
      memlock:
        soft: -1
        hard: -1
    security_opt:
      - apparmor:unconfined
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /tmp/traceos-sandbox:/tmp/traceos-sandbox
    env_file:
      - .env
    environment:
      - SERVICE_NAME=observability
      - PORT=9091
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=${PG_USER:-traceos}
      - PG_PASSWORD=${PG_PASSWORD:-traceos_dev}
      - PG_DATABASE=${PG_DATABASE:-traceos}
      - NATS_URL=nats://nats:4222
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.obs.rule=PathPrefix(`/api/obs/`)"
      - "traefik.http.routers.obs.entrypoints=web"
      - "traefik.http.services.obs.loadbalancer.server.port=9091"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9091/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    image: traceos-lab-frontend:latest
    container_name: traceos-frontend
    profiles: ["app"]
    restart: unless-stopped
    dns:
      - 127.0.0.11
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-}
      - HOST_METRICS_URL=http://host.docker.internal:8766/metrics
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.fix-xfh.headers.customrequestheaders.X-Forwarded-Host=47.96.252.144"
      - "traefik.http.routers.frontend.middlewares=fix-xfh@docker"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
# =============================================================================
# 持久化卷
# =============================================================================
volumes:
  pgdata:
    driver: local
  minio_data:
    driver: local
  nats_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
